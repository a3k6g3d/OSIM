# osim serve -c examples/osim.yaml      (osim plan -c ... prints engine commands without running)
server:
  host: 0.0.0.0
  port: 8000
  # api_key: change-me            # require "Authorization: Bearer <key>"
  max_concurrency: 256            # per-model in-flight cap; excess waits, then gets HTTP 429
  queue_timeout: 30

models:
  # Hugging Face directory -> vLLM (auto). Two replicas with prefix-affinity routing.
  - name: qwen-vl
    source: /models/Qwen2.5-VL-7B-Instruct
    replicas: 2
    options: {tensor_parallel_size: 1, max_model_len: 16384, gpu_memory_utilization: 0.9}

  # Same kind of weights on SGLang (RadixAttention prefix cache).
  - name: llama-sglang
    source: hf:meta-llama/Llama-3.1-8B-Instruct
    engine: sglang
    options: {tensor_parallel_size: 2}

  # Model already pulled with `ollama pull` -> read straight from ~/.ollama/models.
  - name: llama3.2
    source: ollama:llama3.2:3b

  # A GGUF file plus an Ollama Modelfile (template/system/params are imported).
  - name: assistant
    source: ./Modelfile

  # Attach to engines that are already running instead of launching them.
  - name: shared-vllm
    source: hf:mistralai/Mistral-7B-Instruct-v0.3
    engine: vllm
    urls: ["http://gpu-a:8000", "http://gpu-b:8000"]
