[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osim"
version = "0.1.0"
description = "OSIM: open-source inference & serving gateway for LLMs and multimodal models over vLLM, SGLang and Ollama"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
osim = "osim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
